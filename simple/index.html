<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111214"><title>Simple Workout</title><style>*{box-sizing:border-box}body{margin:0;background:#111214;color:#f7f7f7;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:650px;margin:auto;padding:22px 14px 60px}h1{margin:0;font-size:26px}p,.muted{color:#aeb2b9;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:22px 0}.tabs button{border:1px solid #444;border-radius:10px;padding:12px 0;background:#22252a;color:white;font-weight:bold}.tabs .selected{background:#94e478;color:#101510}.card{background:#1d2025;border:1px solid #34383e;border-radius:18px;padding:16px}.header{display:flex;justify-content:space-between;align-items:center}.bar{height:7px;background:#34383e;border-radius:8px;margin:14px 0}.fill{height:100%;background:#94e478;border-radius:8px}.exercise{display:flex;align-items:center;gap:10px;border-bottom:1px solid #35383d;padding:16px 0}.exercise:last-child{border-bottom:0}.check{border:2px solid #888;border-radius:6px;background:transparent;color:#111;width:26px;height:26px;flex-shrink:0}.check.done{background:#94e478;border-color:#94e478}.name{flex:1;font-weight:600}.name.done{text-decoration:line-through;color:#9ca0a5}.right{text-align:right;min-width:118px}.target{font-size:13px;font-weight:700}.dots{display:flex;justify-content:flex-end;gap:1px;margin-top:5px}.dot{border:0;background:none;color:#9ca0a5;font-size:21px;padding:3px;min-width:24px}.dot.done{color:#94e478}.reset{margin:15px 0 0 auto;display:block;background:transparent;border:1px solid #666;color:white;border-radius:9px;padding:10px 14px}</style></head><body><main><h1>Simple Workout</h1><p>Tap sets. Check off exercises. That's it.</p><nav class="tabs" id="tabs"></nav><section class="card"><div class="header"><div><strong id="title"></strong><div class="muted" id="count"></div></div><strong id="percent"></strong></div><div class="bar"><div class="fill" id="fill"></div></div><div id="list"></div><button class="reset" id="reset">↻ Reset day</button></section><p>Progress saves on this device automatically. No weights or reps to enter.</p></main><script>
const days=[
["Chest + Back",[["DB Bench Press",4,"6–10"],["Pull-Up or Lat Pulldown",4,"6–10"],["Chest-Supported Row",4,"8–12"],["Incline DB Bench",3,"8–12"],["Straight-Arm Pulldown",3,"12–15"],["Face Pull",3,"12–20"]]],
["Delts + Glutes",[["Standing Barbell or DB Press",4,"6–10"],["Hip Thrust",4,"8–12"],["Lateral Raise",4,"12–20"],["Rear Delt Fly",3,"12–20"],["Bulgarian Split Squat",3,"8–12"],["Cable External Rotation / Band Pull-Aparts",2,"15–20"]]],
["Yoke + Trunk",[["DB or Barbell Shrugs",4,"10–15"],["Farmer Carry",3,"rounds"],["Ab Wheel",3,"8–15"],["Cable Crunch",3,"10–20"],["Plank",3,"30–60 sec"]]],
["Legs + Chest + Back",[["Leg Press",4,"8–12"],["Romanian Deadlift",4,"6–10"],["45° Back Extension",3,"10–15"],["Incline DB Bench",3,"8–12"],["Lat Pulldown",3,"8–12"],["Standing Calf Raise",3,"12–20"]]],
["Arms + Accessories",[["EZ Curl",4,"8–12"],["Hammer Curl",3,"10–15"],["Pressdown",4,"8–12"],["Overhead Rope Extension",3,"10–15"],["Lateral Raise",4,"12–20"],["Face Pull / Cable Y Raise",3,"12–20"]]]
];let state={};try{state=JSON.parse(localStorage.getItem("simpleWorkout.v1"))||{}}catch{}let day=Math.max(0,Math.min(4,new Date().getDay()-1));const save=()=>localStorage.setItem("simpleWorkout.v1",JSON.stringify(state));const id=i=>day+"-"+i;const values=i=>Array.from({length:days[day][1][i][1]},(_,j)=>!!state[id(i)]?.[j]);const make=(tag,cls,txt)=>{const e=document.createElement(tag);e.className=cls||"";if(txt!==undefined)e.textContent=txt;return e};
function render(){const tabs=document.getElementById("tabs");tabs.replaceChildren();["Mon","Tue","Wed","Thu","Fri"].forEach((d,i)=>{const b=make("button",i===day?"selected":"",d);b.onclick=()=>{day=i;render()};tabs.append(b)});document.getElementById("title").textContent=days[day][0];const list=document.getElementById("list");list.replaceChildren();let complete=0;days[day][1].forEach(([name,n,reps],i)=>{const a=values(i),all=a.every(Boolean);if(all)complete++;const row=make("div","exercise"),check=make("button","check"+(all?" done":""),all?"✓":"");check.setAttribute("aria-label","Complete "+name);check.onclick=()=>{state[id(i)]=Array(n).fill(!all);save();render()};row.append(check,make("div","name"+(all?" done":""),name));const right=make("div","right");right.append(make("div","target",n+" × "+reps));const dots=make("div","dots");a.forEach((on,j)=>{const b=make("button","dot"+(on?" done":""),on?"●":"○");b.setAttribute("aria-label",name+" set "+(j+1));b.onclick=()=>{const v=values(i);v[j]=!v[j];state[id(i)]=v;save();render()};dots.append(b)});right.append(dots);row.append(right);list.append(row)});document.getElementById("count").textContent=complete+" of "+days[day][1].length+" exercises completed";const pct=Math.round(complete/days[day][1].length*100);document.getElementById("percent").textContent=pct+"%";document.getElementById("fill").style.width=pct+"%"}document.getElementById("reset").onclick=()=>{if(!confirm("Reset this day's checkmarks?"))return;days[day][1].forEach((_,i)=>delete state[id(i)]);save();render()};render();</script></body></html>
